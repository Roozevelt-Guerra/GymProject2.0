<section class="container section">
  <a class="text-link" routerLink="/">← Voltar ao catálogo</a>@if(error()){
  <div class="empty" role="alert">{{error()}}</div>
  }@else if(equipment();as e){
  <div class="detail-grid">
    <img class="detail-image" [src]="e.imageUrl" [alt]="e.name" />
    <div>
      <div class="eyebrow red">{{e.category}}</div>
      <h1>{{e.name}}</h1>
      <p class="description">{{e.description}}</p>
      <div class="detail-price">{{e.price | currency:'BRL'}}</div>
      <p class="muted">Consulte condições, frete e prazo no orçamento.</p>
      <label
        >Quantidade
        <input
          class="quantity"
          type="number"
          min="1"
          max="99"
          step="1"
          [(ngModel)]="quantity" /></label
      ><button
        class="button wide"
        [disabled]="!valid()"
        (click)="cart.add(e,quantity)"
      >
        Adicionar ao carrinho +</button
      ><a routerLink="/carrinho" class="text-link">Ver meu orçamento →</a>
    </div>
  </div>
  }@else{
  <p class="empty" role="status">Carregando equipamento...</p>
  }
</section>
